<script>
'use strict';
const $c = id => document.getElementById(id);
const labelsContrato = [
  ['diaria1','01 diária',1], ['diaria2','02 diárias',2], ['diaria3','03 diárias',3],
  ['diaria4','04 diárias',4], ['diaria5','05 diárias',5], ['semana','Semana',7],
  ['quinzena','Quinzena',15], ['diarias21','21 diárias',21], ['mensal','Mensal',30]
];
const moedaContrato = new Intl.NumberFormat('pt-BR', {style:'currency',currency:'BRL'});
let contratos = [];
let configuracaoContrato = null;
let orcamentosSalvos = [];
let selecaoOrcamento = new Map();
let quantidadesOrcamento = new Map();
let orcamentoConfirmado = null;
let orcamentoEmEdicao = null;
let revisaoOrcamento = 0;
let contratosOcupado = false;

function avisoContratos(mensagem, tipo='') {
  const atual=$c('painel-orcamentos').hidden?'aviso-contratos':'aviso-orcamento';
  const outro=atual==='aviso-contratos'?'aviso-orcamento':'aviso-contratos';
  $c(outro).textContent='';$c(outro).className='';
  $c(atual).textContent = mensagem;
  $c(atual).className = tipo;
}
function opcao(select, valor, rotulo) {
  const o=document.createElement('option'); o.value=valor; o.textContent=rotulo; select.append(o);
}
function rotuloItemContrato(i) { return i.codigo.startsWith('QTD-') ? `${i.quantidade ?? 1} peças` : i.codigo; }
function rotuloBlocoContrato(b) {return `${b.vezes>1?b.vezes+' × ':''}${periodoContrato(b.faixa)?.[1]||b.faixa}`;}
function periodoContrato(chave) { return labelsContrato.find(p=>p[0]===chave); }
function somaCentavos(valores) { return valores.reduce((total,v)=>total+Math.round(v*100),0)/100; }
function terminoContrato(inicio, dias) {
  const [a,m,d]=inicio.split('-').map(Number);
  return new Date(Date.UTC(a,m-1,d+dias)).toISOString().slice(0,10);
}
function nomeCategoria(id) { return categorias.find(c=>c.id===id)?.nome || 'Categoria'; }
function cotacaoDados() {
  return {modalidade:$c('modalidade-orcamento').value,horaInicio:$c('contrato-hora-inicio').value,clienteId:$c('contrato-cliente').value, inicio:$c('contrato-inicio').value,
    enderecoLocacao:$c('contrato-endereco-locacao').value,horaFim:$c('contrato-hora-fim').value,
    itens:[...selecaoOrcamento].map(([codigo,faixas])=>({codigo,faixas:faixas.slice(),quantidade:quantidadesOrcamento.get(codigo)??1})),
    desconto:{tipo:$c('desconto-tipo').value,
      valor:$c('desconto-tipo').value==='nenhum'?0:$c('desconto-valor').value}};
}
function invalidarOrcamento() {
  revisaoOrcamento++;
  orcamentoConfirmado=null;
  $c('confirmar-contrato').disabled=true;
  $c('pdf-orcamento').disabled=true;
  $c('salvar-orcamento').disabled=true;
  $c('resumo-orcamento').replaceChildren();
  renderResumoLocal();
}
function descontoDoFormulario() {
  const tipo=$c('desconto-tipo').value;
  $c('desconto-valor-area').hidden=tipo==='nenhum';
  const ajuda=$c('desconto-ajuda');
  ajuda.hidden=tipo==='nenhum';
  ajuda.textContent=tipo==='percentual'?'Informe de 0% a 100% do subtotal.':
    tipo==='valor'?'Informe o valor em reais a subtrair do subtotal.':'';
  $c('desconto-valor').max=tipo==='percentual'?'100':'';
  if(tipo==='nenhum')$c('desconto-valor').value='';
  invalidarOrcamento();
}
function limparOrcamento() {
  $c('pdf-decisao').hidden=true;
  orcamentoEmEdicao=null;$c('titulo-orcamento').textContent='Novo orçamento';
  selecaoOrcamento.clear();quantidadesOrcamento.clear();
  $c('contrato-cliente').value='';sincronizarClienteOrcamento();$c('contrato-inicio').value='';
  $c('contrato-hora-fim').value='18:00';$c('modalidade-orcamento').value='FIXO';$c('contrato-hora-inicio').value='09:00';atualizarModalidadeOrcamento();renderEnderecosContrato();
  $c('estoque-busca').value='';$c('estoque-categoria').value='';
  $c('escopo-orcamento').value='todos';$c('faixa-orcamento').value='diaria1';
  $c('desconto-tipo').value='nenhum';$c('desconto-valor').value='';
  descontoDoFormulario();atualizarAlvosOrcamento();renderEstoqueFiltrado();
  invalidarOrcamento();
}
async function iniciarContratos() {
  avisoContratos('Atualizando clientes, estoque e contratos…');
  try {
    const [novosClientes,novasCategorias,novosContratos,novosOrcamentos,novaConfiguracao]=await Promise.all([
      chamar('listarClientes'),chamar('listarCategorias'),chamar('listarContratos'),
      chamar('listarOrcamentosSalvos'),chamar('obterConfiguracaoContrato')]);
    clientes=novosClientes; categorias=novasCategorias; contratos=novosContratos;
    orcamentosSalvos=novosOrcamentos;configuracaoContrato=novaConfiguracao;
    renderizar(); renderizarCategorias(); renderClientesContrato();
    renderEstoqueContrato(); renderListaContratos(); renderOrcamentosSalvos();
    preencherConfiguracaoContrato();
    avisoContratos('');
  } catch(e) { avisoContratos(e.message||'Falha ao carregar os contratos.','erro'); }
}
let sugestoesClientes = [];
let indiceSugestaoCliente = -1;
function normalizarBuscaCliente(valor) {
  return String(valor || '').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLocaleLowerCase('pt-BR').trim();
}
function filtrarClientesOrcamento(termo) {
  const busca=normalizarBuscaCliente(termo), documento=busca.replace(/[^a-z0-9]/g,'');
  return clientes.filter(c=>normalizarBuscaCliente(c.nome).includes(busca) ||
    (documento && normalizarBuscaCliente(c.documento).replace(/[^a-z0-9]/g,'').includes(documento)))
    .sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'));
}
function fecharSugestoesCliente() {
  $c('cliente-sugestoes').hidden=true;
  $c('contrato-cliente-busca').setAttribute('aria-expanded','false');
  $c('contrato-cliente-busca').removeAttribute('aria-activedescendant');
  indiceSugestaoCliente=-1;
}
function sincronizarClienteOrcamento() {
  const cliente=clientes.find(c=>c.id===$c('contrato-cliente').value);
  if(!cliente)$c('contrato-cliente').value='';
  $c('contrato-cliente-busca').value=cliente?`${cliente.nome} · ${cliente.documento}`:'';
  $c('cliente-busca-status').textContent=cliente?'Cliente selecionado.':'Digite e selecione um cliente nas sugestões.';
  fecharSugestoesCliente();
}
function selecionarClienteOrcamento(cliente) {
  $c('contrato-cliente').value=cliente.id;
  sincronizarClienteOrcamento();renderEnderecosContrato();invalidarOrcamento();
  $c('contrato-cliente-busca').focus();
  fecharSugestoesCliente();
}
function marcarSugestaoCliente(indice) {
  indiceSugestaoCliente=indice;
  const lista=$c('cliente-sugestoes');
  [...lista.children].forEach((el,i)=>el.setAttribute('aria-selected',String(i===indice)));
  const ativa=lista.children[indice];
  if(ativa){$c('contrato-cliente-busca').setAttribute('aria-activedescendant',ativa.id);ativa.scrollIntoView({block:'nearest'});}
}
function mostrarSugestoesCliente() {
  const campo=$c('contrato-cliente-busca'),lista=$c('cliente-sugestoes');
  const encontrados=filtrarClientesOrcamento($c('contrato-cliente').value?'':campo.value);
  sugestoesClientes=encontrados.slice(0,20);indiceSugestaoCliente=-1;
  campo.removeAttribute('aria-activedescendant');lista.replaceChildren();
  sugestoesClientes.forEach((cliente,i)=>{
    const b=document.createElement('button');b.type='button';b.className='cliente-sugestao';b.id=`cliente-sugestao-${i}`;
    b.setAttribute('role','option');b.setAttribute('aria-selected','false');b.tabIndex=-1;
    const nome=document.createElement('strong'),doc=document.createElement('small');nome.textContent=cliente.nome;doc.textContent=cliente.documento;
    b.append(nome,doc);b.addEventListener('click',()=>selecionarClienteOrcamento(cliente));lista.append(b);
  });
  if(!sugestoesClientes.length){const p=document.createElement('p');p.className='cliente-sem-resultados';p.textContent='Nenhum cliente encontrado.';lista.append(p);}
  $c('cliente-busca-status').textContent=encontrados.length>20?'Mostrando 20 sugestões. Continue digitando para refinar a busca.':
    encontrados.length?`${encontrados.length} cliente(s) encontrado(s). Selecione uma sugestão.`:'Nenhum cliente encontrado.';
  lista.hidden=false;campo.setAttribute('aria-expanded','true');
}
function iniciarBuscaClienteOrcamento() {
  const campo=$c('contrato-cliente-busca');
  campo.addEventListener('input',()=>{
    $c('contrato-cliente').value='';renderEnderecosContrato();invalidarOrcamento();mostrarSugestoesCliente();
  });
  campo.addEventListener('focus',mostrarSugestoesCliente);
  campo.addEventListener('click',mostrarSugestoesCliente);
  campo.addEventListener('keydown',e=>{
    if(e.key==='Escape'){fecharSugestoesCliente();return;}
    if(e.key==='Tab'){fecharSugestoesCliente();return;}
    if(['ArrowDown','ArrowUp'].includes(e.key)){
      e.preventDefault();if($c('cliente-sugestoes').hidden)mostrarSugestoesCliente();
      if(sugestoesClientes.length)marcarSugestaoCliente(e.key==='ArrowDown'?Math.min(indiceSugestaoCliente+1,sugestoesClientes.length-1):Math.max(indiceSugestaoCliente-1,0));
    }else if(e.key==='Enter' && !$c('cliente-sugestoes').hidden){
      e.preventDefault();if(indiceSugestaoCliente>=0)selecionarClienteOrcamento(sugestoesClientes[indiceSugestaoCliente]);
    }
  });
  document.addEventListener('pointerdown',e=>{if(!$c('cliente-busca-area').contains(e.target))fecharSugestoesCliente();});
  campo.addEventListener('blur',()=>{
    // O clique em uma sugestão é processado antes desta verificação.
    setTimeout(()=>{if(!$c('cliente-busca-area').contains(document.activeElement))fecharSugestoesCliente();},0);
  });
}
function renderClientesContrato() {
  sincronizarClienteOrcamento();
  renderEnderecosContrato($c('contrato-endereco-locacao').value);
}
function renderEnderecosContrato(escolhido='') {
  const select=$c('contrato-endereco-locacao');select.replaceChildren();
  const cliente=clientes.find(c=>c.id===$c('contrato-cliente').value);
  select.disabled=!cliente;$c('novo-endereco-orcamento').disabled=!cliente;
  if(!cliente){opcao(select,'','Selecione um cliente primeiro');return;}
  const enderecos=cliente.enderecosLocacao||[cliente.endereco];
  enderecos.forEach((e,i)=>opcao(select,e,`${i===0?'Endereço cadastral: ':''}${e}`));
  if(escolhido && !enderecos.includes(escolhido))opcao(select,escolhido,`${escolhido} (endereço anterior; atualize o cadastro ou selecione outro)`);
  select.value=escolhido||enderecos[0]||'';
}
function textoLimpezaOrcamento(i) {
  if(i.taxaLimpeza==null)return 'Taxa de limpeza não registrada neste orçamento antigo; recalcule para consultar o valor atual.';
  const valor=Math.round(i.subtotal*i.taxaLimpeza)/100;
  return `${i.referencia?'Referência provisória de limpeza':'Limpeza condicional'} (${i.taxaLimpeza}%): ${moedaContrato.format(valor)}${i.quantidade>1?' no lote ('+moedaContrato.format(Math.round(i.subtotal/i.quantidade*i.taxaLimpeza)/100)+' por peça)':''}. Cobrança à parte se a devolução exigir limpeza; não incluída no total.`;
}
function adicionarNotaLimpeza(area,i) {
  const nota=document.createElement('p');nota.className='muted';nota.style.fontSize='12px';nota.textContent=textoLimpezaOrcamento(i);area.append(nota);
}
function encerramentoTexto(data,hora) {return dataBR(data)+(hora?' às '+hora:'');}

function renderEstoqueContrato() {
  const disponiveis=new Map();
  categorias.forEach(c=>c.unidades.filter(u=>!u.locado&&!u.emManutencao).forEach(u=>disponiveis.set(u.codigo,{...u,categoriaId:c.id,nome:c.nome})));
  for(const codigo of selecaoOrcamento.keys())if(!disponiveis.has(codigo))selecaoOrcamento.delete(codigo);
  const filtro=$c('estoque-categoria'),categoriaAnterior=filtro.value;
  filtro.replaceChildren();opcao(filtro,'','Todas as categorias');
  categorias.filter(c=>c.unidades.some(u=>!u.locado&&!u.emManutencao)).sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR'))
    .forEach(c=>opcao(filtro,c.id,c.nome));
  if([...filtro.options].some(o=>o.value===categoriaAnterior))filtro.value=categoriaAnterior;
  renderEstoqueFiltrado();
  atualizarAlvosOrcamento();invalidarOrcamento();
}
function atualizarContadorEstoque(){
  $c('estoque-contador').textContent=`${selecaoOrcamento.size} ${selecaoOrcamento.size===1?'selecionada':'selecionadas'}`;
}
function renderEstoqueFiltrado() {
  const termo=$c('estoque-busca').value.trim().toLocaleLowerCase('pt-BR');
  const categoria=$c('estoque-categoria').value;
  const area=$c('estoque-disponivel');area.replaceChildren();
  let exibidos=0,disponiveis=0;
  categorias.slice().sort((a,b)=>a.nome.localeCompare(b.nome,'pt-BR')).forEach(c=>{
    c.unidades.filter(u=>!u.locado&&!u.emManutencao).forEach(u=>{
      disponiveis++;
      if(categoria&&c.id!==categoria)return;
      if(termo&&!`${c.nome} ${u.codigo}`.toLocaleLowerCase('pt-BR').includes(termo))return;
      exibidos++;
      const label=document.createElement(u.porQuantidade?'div':'label');label.className='rental-row';
      const box=document.createElement('input');box.type='checkbox';box.checked=selecaoOrcamento.has(u.codigo);
      box.addEventListener('change',()=>{
        if(box.checked)selecaoOrcamento.set(u.codigo,[]);else selecaoOrcamento.delete(u.codigo);
        atualizarContadorEstoque();atualizarAlvosOrcamento();invalidarOrcamento();
      });
      const strong=document.createElement('strong');strong.textContent=u.porQuantidade?`${c.nome} · ${u.quantidadeDisponivel} peças disponíveis`:`${c.nome} · ${u.codigo}`;
      box.setAttribute('aria-label',`Selecionar ${c.nome}`);
      const small=document.createElement('small');small.textContent=u.semManutencao?' · sem manutenção programada':` · manutenção ${dataBR(u.manutencao)}`;
      label.append(box,strong,small);area.append(label);
      if(u.porQuantidade){
        const rotulo=document.createElement('label');rotulo.textContent='Quantidade de peças';
        const quantidade=document.createElement('input');quantidade.type='number';quantidade.min='1';quantidade.max=String(u.quantidadeDisponivel);quantidade.step='1';
        quantidade.style.width='110px';quantidade.style.marginLeft='10px';quantidade.value=String(quantidadesOrcamento.get(u.codigo)??1);
        quantidade.addEventListener('input',()=>{quantidadesOrcamento.set(u.codigo,Number(quantidade.value));invalidarOrcamento()});
        rotulo.append(quantidade);label.append(rotulo);
      }
    });
  });
  if(!exibidos){const p=document.createElement('p');p.className='vazio';
    p.textContent=disponiveis?'Nenhuma unidade corresponde aos filtros.':'Não há unidades disponíveis.';area.append(p)}
  atualizarContadorEstoque();
}
function atualizarAlvosOrcamento() {
  const escopo=$c('escopo-orcamento').value,alvo=$c('alvo-orcamento'),anterior=alvo.value;
  $c('alvo-orcamento-area').hidden=escopo==='todos';alvo.replaceChildren();
  if(escopo==='categoria'){
    categorias.filter(c=>c.unidades.some(u=>selecaoOrcamento.has(u.codigo)))
      .forEach(c=>opcao(alvo,c.id,c.nome));
  }else if(escopo==='unidade'){
    categorias.forEach(c=>c.unidades.filter(u=>selecaoOrcamento.has(u.codigo))
      .forEach(u=>opcao(alvo,u.codigo,`${c.nome} · ${u.porQuantidade?'peças selecionadas':u.codigo}`)));
  }
  if([...alvo.options].some(o=>o.value===anterior))alvo.value=anterior;
}
function unidadesDoEscopo() {
  const escopo=$c('escopo-orcamento').value,alvo=$c('alvo-orcamento').value;
  if(escopo==='todos')return [...selecaoOrcamento.keys()];
  if(!alvo)return [];
  if(escopo==='unidade')return selecaoOrcamento.has(alvo)?[alvo]:[];
  return categorias.find(c=>c.id===alvo)?.unidades.filter(u=>selecaoOrcamento.has(u.codigo)).map(u=>u.codigo)||[];
}
function renderResumoLocal() {
  const area=$c('resumo-orcamento');
  if(!selecaoOrcamento.size)return;
  if($c('modalidade-orcamento').value==='ABERTO'){
    const nota=document.createElement('p');nota.textContent='Prazo em aberto: calcule para conferir a referência de 1 diária e registrar a tabela de tarifas. Valor definitivo será apurado na devolução.';area.append(nota);
    for(const [codigo] of selecaoOrcamento){const cat=categorias.find(c=>c.unidades.some(u=>u.codigo===codigo));const p=document.createElement('p');p.textContent=`${cat?.nome||'Equipamento'} · ${rotuloItemContrato({codigo,quantidade:quantidadesOrcamento.get(codigo)||1})} · limpeza condicional ${cat?.taxaLimpeza||0}% sobre as diárias finais, à parte`;area.append(p);if(cat?.unidades.find(u=>u.codigo===codigo)?.manutencao){const aviso=document.createElement('p');aviso.className='maintenance-warning';aviso.textContent='Locação sem prazo final: acompanhe a manutenção deste equipamento.';area.append(aviso);}}
    return;
  }
  const titulo=document.createElement('strong');titulo.textContent='Períodos por unidade';area.append(titulo);
  [...selecaoOrcamento].forEach(([codigo,faixas])=>{
    const categoria=categorias.find(c=>c.unidades.some(u=>u.codigo===codigo));
    const linha=document.createElement('div');linha.className='quote-line';
    const quantidade=quantidadesOrcamento.get(codigo)??1;
    const strong=document.createElement('strong');strong.textContent=`${categoria?.nome||'Equipamento'} · ${rotuloItemContrato({codigo,quantidade})}`;
    const p=document.createElement('p');
    const dias=faixas.reduce((n,f)=>n+(periodoContrato(f)?.[2]||0),0);
    const subtotal=somaCentavos(faixas.map(f=>(categoria?.precos[f]||0)*quantidade));
    p.textContent=faixas.length?`${faixas.map(f=>periodoContrato(f)?.[1]).join(' + ')} = ${dias} diárias · ${moedaContrato.format(subtotal)}`:'Escolha ao menos um período.';
    const unidade=categoria?.unidades.find(u=>u.codigo===codigo);
    const inicio=$c('contrato-inicio').value;
    if(inicio&&dias)p.textContent+=` · até ${encerramentoTexto(terminoContrato(inicio,dias),$c('contrato-hora-fim').value)}`;
    if(inicio&&dias&&unidade?.manutencao){
      const fim=terminoContrato(inicio,dias);
      if(fim>=unidade.manutencao){
        const aviso=document.createElement('p');aviso.className='maintenance-warning';
        aviso.textContent=`Atenção: a manutenção está prevista para ${dataBR(unidade.manutencao)} e a locação vai até ${dataBR(fim)}.`;
        linha.append(aviso);
      }
    }
    const remover=document.createElement('button');remover.type='button';remover.className='secondary';
    remover.textContent='Remover último período';remover.disabled=!faixas.length;
    remover.addEventListener('click',()=>{faixas.pop();invalidarOrcamento()});
    linha.append(strong,p,remover);if(faixas.length)adicionarNotaLimpeza(linha,{subtotal,quantidade,taxaLimpeza:categoria?.taxaLimpeza??0});area.append(linha);
  });
}
function renderCotacao(cotacao) {
  const area=$c('resumo-orcamento');area.replaceChildren();
  const titulo=document.createElement('h2');titulo.textContent=cotacao.modalidade==='ABERTO'?'Prazo em aberto — referência de 1 diária':'Orçamento calculado';area.append(titulo);
  const local=document.createElement('p');local.textContent='Endereço de locação: '+cotacao.enderecoLocacao;area.append(local);
  cotacao.itens.forEach(i=>{
    const linha=document.createElement('div');linha.className='quote-line';
    const nome=document.createElement('strong');nome.textContent=`${i.categoria} · ${rotuloItemContrato(i)}`;
    const detalhe=document.createElement('p');detalhe.textContent=`${i.blocos.map(rotuloBlocoContrato).join(' + ')} · ${i.diarias} diárias · até ${encerramentoTexto(i.fim,cotacao.horaFim)} · ${moedaContrato.format(i.subtotal)}`;
    if(cotacao.modalidade==='ABERTO')detalhe.textContent=`Sem término definido · referência mínima: ${moedaContrato.format(i.subtotal)} · ${i.blocos.map(rotuloBlocoContrato).join(' + ')}; tarifas completas preservadas na contratação.`;
    linha.append(nome,detalhe);adicionarNotaLimpeza(linha,{...i,referencia:cotacao.modalidade==='ABERTO'});
    if(cotacao.modalidade==='ABERTO'){const p=document.createElement('p');p.className='muted';p.textContent=labelsContrato.map(([f,l])=>`${l}: ${moedaContrato.format(i.tarifas[f])}`).join(' · ');linha.append(p);}
    if(i.alertaManutencao){const aviso=document.createElement('p');aviso.className='maintenance-warning';
      aviso.textContent=`Atenção: locação em aberto requer acompanhamento da manutenção; data prevista ${dataBR(i.manutencao)}. `;
      if(cotacao.modalidade!=='ABERTO')aviso.textContent=`Atenção: manutenção prevista para ${dataBR(i.manutencao)} durante esta locação. A unidade continua disponível para contratar.`;
      linha.append(aviso)}
    area.append(linha);
  });
  const subtotal=document.createElement('p');subtotal.textContent=`Subtotal: ${moedaContrato.format(cotacao.subtotal)}`;
  area.append(subtotal);
  if(cotacao.desconto.tipo!=='nenhum'){
    const desconto=document.createElement('p');
    const rotulo=cotacao.desconto.tipo==='percentual'?`${cotacao.desconto.valor}%`:
      moedaContrato.format(cotacao.desconto.valor);
    desconto.textContent=`Desconto (${rotulo}): − ${moedaContrato.format(cotacao.desconto.aplicado)}`;
    area.append(desconto);
  }
  const total=document.createElement('p');total.className='total-line';
  total.textContent=`Total do orçamento: ${moedaContrato.format(cotacao.total)} · último dia: ${encerramentoTexto(cotacao.fim,cotacao.horaFim)}`;

function baixarArquivoPDF(arquivo) {
  const binario=atob(arquivo.base64),bytes=new Uint8Array(binario.length);
  for(let i=0;i<binario.length;i++)bytes[i]=binario.charCodeAt(i);
  const url=URL.createObjectURL(new Blob([bytes],{type:'application/pdf'}));
  const link=document.createElement('a');link.href=url;link.download=arquivo.nome;
  document.body.append(link);link.click();link.remove();
  setTimeout(()=>URL.revokeObjectURL(url),60000);
}

  controle.append(campo,lista);area.append(label,controle,status);
  let selecionado=null,resultados=[],ativo=-1;

  function selecionar(item){

    if(orcamentoEmEdicao){
      const salvo=await chamar('salvarOrcamento',{
        ...dados,...orcamentoEmEdicao,totalEsperado:cotacao.total});
      orcamentoEmEdicao={id:salvo.id,versao:salvo.versao};
      res=await chamar('confirmarOrcamentoSalvo',salvo.id,salvo.versao);
    }else res=await chamar('confirmarContrato',{...dados,totalEsperado:cotacao.total});
    limparOrcamento();await iniciarContratos();
    avisoContratos(`Contrato ${res.id} criado. Unidades reservadas. ${res.modalidade==='ABERTO'?'Prazo em aberto; valor final a apurar.':'Total '+moedaContrato.format(res.total)+'.'}`,'sucesso');}
  catch(e){orcamentoConfirmado=null;
    try{await iniciarContratos()}catch(_erro){}
    avisoContratos(e.message||'Falha ao confirmar o contrato. Calcule novamente.','erro')}
  finally{contratosOcupado=false}
});
</script>
